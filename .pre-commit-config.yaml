exclude: parse_emails/tests/test_data/.*|parse_emails/__init__.py
repos:
    - repo: https://github.com/pre-commit/pre-commit-hooks
      rev: v6.0.0
      hooks:
          - id: trailing-whitespace
          - id: end-of-file-fixer
          - id: check-docstring-first
          - id: check-json
            exclude: .vscode/.*
          - id: check-yaml
          - id: debug-statements
            language_version: python3
          - id: name-tests-test
          - id: check-ast
          - id: check-merge-conflict
          - id: check-toml
          - id: check-xml
          - id: check-added-large-files
          - id: check-case-conflict
    - repo: https://github.com/hadialqattan/pycln
      rev: v2.6.0
      hooks:
        - id: pycln
    - repo: https://github.com/pycqa/flake8
      rev: "7.3.0"
      hooks:
          - id: flake8
    - repo: https://github.com/hhatto/autopep8
      rev: v2.3.2
      hooks:
          - id: autopep8
    - repo: https://github.com/PyCQA/isort
      rev: "8.0.1"
      hooks:
          - id: isort
            types: [python]
    - repo: https://github.com/asottile/pyupgrade
      rev: v3.21.2
      hooks:
          - id: pyupgrade
            args: [--py310-plus]
    - repo: https://github.com/python-poetry/poetry
      rev: 1.8.5
      hooks:
      - id: poetry-check
        args:
        - --lock
        files: ^pyproject.toml$
    - repo: https://github.com/pre-commit/mirrors-mypy
      rev: v2.1.0
      hooks:
        - id: mypy
          additional_dependencies: [
              types-PyYAML==6.0.12.20260518,
              types-setuptools==83.0.0.20260706,
              types-ujson==5.10.0.20250822,
              types-pytz==2026.2.0.20260518,
              types-requests==2.33.0.20260712,
              types-decorator==5.2.0.20260712,
              types-dateparser==1.4.1.20260617,
              types-tabulate==0.10.0.20260508,
              types-python-dateutil==2.9.0.20260518
          ]
